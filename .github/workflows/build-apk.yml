name: Build Store Admin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04 # 🔴 Yahan change kiya hai (latest se 22.04 par)

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Dependencies
        run: |
          cd mr-chicken-store-admin
          npm install

      - name: 🏗️ Build Web App (Vite)
        run: |
          cd mr-chicken-store-admin
          npm run build

      - name: 🔄 Install & Setup Capacitor (Android)
        run: |
          cd mr-chicken-store-admin
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "Store Admin" "com.mrchicken.storeadmin" --web-dir dist
          npx cap add android

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔨 Build Debug APK
        run: |
          cd mr-chicken-store-admin/android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Store-Admin-Debug-APK
          path: mr-chicken-store-admin/android/app/build/outputs/apk/debug/app-debug.apk
